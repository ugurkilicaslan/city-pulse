services:
  city-pulse:
    image: city-pulse:dev
    build:
      context: .
      target: dev
    container_name: city-pulse-dev
    environment:
      - ENV=development
    ports:
      - "3649:3649"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/tmp
