stages:
  - deploy

# Shell runner sunucuda çalışır (weather-service ile aynı GitLab CI pattern)
deploy:
  stage: deploy
  tags:
    - city-pulse
  rules:
    - if: '$CI_COMMIT_REF_NAME != "main"'
      when: never
    - when: always
  script:
    - docker ps -a --filter "name=city-pulse" -q | xargs -r docker container stop
    - docker ps -a --filter "name=city-pulse" -q | xargs -r docker container rm
    - docker compose down --remove-orphans
    - docker compose -f docker-compose.yml up --build -d
