[build]
  cmd = "go build -o ./tmp/main ."
  entrypoint = ["./tmp/main", "--dev"]
  exclude_dir = ["tmp", "vendor"]
  include_ext = ["go"]
  exclude_file = []
  delay = 1000
  log = "stdout"
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true

[color]
  main = "yellow"
  watcher = "cyan"
  build = "green"
  runner = "magenta"
