<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>city pulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Dark Purple Theme */
            --bg:      #1c0c2b; /* Koyu Mor (resimdeki) */
            --bg2:     #241036; /* Biraz daha açık mor */
            --card:    #2a1340; /* Kart arkaplanı */
            --card-h:  #341850; /* Kart hover */
            --bdr:     #4a2473; /* Kenarlık */
            --bdr-a:   #6b36a1; /* Kenarlık aktif */
            --t1:      #fdfcff; /* Beyaz metin */
            --t2:      #d1c4e9; /* Açık mor metin */
            --t3:      #9575cd; /* Soluk mor metin */
            
            --primary: #FFC53D; /* Gold/Amber (Değişmedi) */
            --dark:    #0B051A; /* Dark Navy (Değişmedi) */
            --mint:    #2ECC71; /* Mint Green (Değişmedi) */
            --gradient: linear-gradient(135deg, #F39C12, #E67E22); /* Sunset Grad */
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--t1);
            min-height: 100vh;
        }

        /* ═══════════════════════════ NAV ═══════════════════════════ */
        .nav {
            position: sticky; top: 0; z-index: 50;
            background: var(--bg2);
            border-bottom: 3px solid var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            height: 70px;
            display: flex; align-items: center;
            padding: 0 1.75rem; gap: 1.25rem;
        }

        /* Logo */
        .logo-wrap {
            display: flex; align-items: center; gap: 0.7rem;
            cursor: pointer; text-decoration: none;
        }

        .logo-svg-wrap {
            position: relative; width: 38px; height: 38px;
            flex-shrink: 0;
        }

        .logo-bg {
            position: absolute; inset: 0; border-radius: 11px;
            background: var(--gradient);
            transition: transform 0.35s cubic-bezier(.34,1.56,.64,1),
                        box-shadow 0.35s;
        }

        .logo-wrap:hover .logo-bg {
            transform: rotate(-8deg) scale(1.08);
            box-shadow: 0 0 24px rgba(243, 156, 18, 0.45);
        }

        .logo-svg {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
        }

        /* City skyline + pulse path inside logo */
        .city-path   { transition: fill-opacity 0.3s; fill: rgba(255,255,255,0.22); }
        .pulse-path  {
            stroke-dasharray: 80;
            stroke-dashoffset: 0;
            transition: stroke 0.3s;
            stroke: rgba(255,255,255,0.9);
        }
        .logo-wrap:hover .pulse-path {
            animation: draw-pulse 0.65s ease-in-out forwards;
            stroke: #ffffff;
        }
        @keyframes draw-pulse {
            0%   { stroke-dashoffset: 80; }
            100% { stroke-dashoffset: 0;  }
        }

        /* Nav title */
        .nav-title {
            font-family: 'Aldrich', sans-serif;
            font-size: 1.2rem; font-weight: bold; letter-spacing: 0.05em;
            color: var(--primary);
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* Live badge */
        .live {
            display: flex; align-items: center; gap: 0.35rem;
            background: var(--mint);
            border: 2px solid var(--dark);
            border-radius: 6px; padding: 0.22rem 0.6rem;
            font-family: 'Aldrich', sans-serif;
            font-size: 0.65rem; font-weight: bold; letter-spacing: 0.06em;
            color: var(--dark);
            text-transform: uppercase;
        }
        .live-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--dark);
            animation: blink 2s ease-in-out infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

        .nav-gap { flex: 1; }

        /* Controls */
        .ctrl-group { display: flex; align-items: center; gap: 0.5rem; }

        select.ctrl {
            background: var(--card);
            border: 2px solid var(--bdr);
            color: var(--t1);
            border-radius: 6px; padding: 0.45rem 0.7rem;
            font-family: 'Inter', sans-serif; font-size: 0.78rem; font-weight: 600;
            cursor: pointer; outline: none;
            transition: border-color .2s;
            appearance: none; -webkit-appearance: none;
        }
        select.ctrl:hover, select.ctrl:focus {
            border-color: var(--dark);
        }

        .btn-refresh {
            display: flex; align-items: center; gap: 0.4rem;
            background-color: var(--primary);
            color: var(--dark);
            border: 2px solid var(--dark);
            border-radius: 8px; padding: 0.45rem 1rem;
            font-family: 'Aldrich', sans-serif;
            font-size: 0.8rem; font-weight: bold; text-transform: uppercase;
            cursor: pointer;
            transition: transform .15s, box-shadow .2s, background-color .2s;
            box-shadow: 2px 2px 0px rgba(11,5,26,1); /* Retro solid shadow */
        }
        .btn-refresh:hover  { transform: translate(-2px, -2px); box-shadow: 4px 4px 0px rgba(11,5,26,1); }
        .btn-refresh:active { transform: translate(0, 0); box-shadow: 0px 0px 0px rgba(11,5,26,1); }
        .btn-refresh:disabled { opacity: .6; cursor: not-allowed; transform: none; box-shadow: 2px 2px 0px rgba(11,5,26,1); }

        .spin-ico { display: inline-block; }
        .btn-refresh.loading .spin-ico { animation: spin .7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ═══════════════════════════ MAIN ══════════════════════════ */
        .main { max-width: 1380px; margin: 0 auto; padding: 1.75rem 2rem 3rem; }

        .page-head {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--bdr);
            padding-bottom: 0.5rem;
        }
        .page-city {
            font-family: 'Aldrich', sans-serif;
            font-size: 1.5rem; font-weight: 700;
            display: flex; align-items: center; gap: 0.45rem; color: var(--t1);
        }
        .page-time { font-family: 'Aldrich', sans-serif; font-size: 0.85rem; color: var(--t3); }

        /* ─── Section label ─── */
        .sec-lbl {
            font-family: 'Aldrich', sans-serif;
            font-size: 1rem; font-weight: bold; letter-spacing: .05em;
            text-transform: uppercase; color: var(--t2); margin-bottom: 1rem;
        }

        /* ─── Exchange grid ─── */
        .xgrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
            gap: .85rem; margin-bottom: 2rem;
        }

        .xcard {
            background: var(--card); border: 2px solid var(--bdr);
            border-radius: 8px; padding: 1.1rem 1.3rem;
            position: relative; overflow: hidden;
            transition: transform .15s, box-shadow .2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .xcard::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: var(--gradient);
        }
        .xcard:hover { box-shadow: 4px 4px 0px rgba(11,5,26,0.1); transform: translate(-2px, -2px); }

        .xcard-pair { font-size: .7rem; color: var(--t3); font-weight: 500; margin-bottom: .3rem; }
        .xcard-rate {
            font-size: 1.7rem; font-weight: 800; letter-spacing: -.03em;
            line-height: 1; color: var(--t1);
        }
        .xcard-desc { font-size: .7rem; color: var(--t2); margin-top: .25rem; }
        .xcard-date { font-size: .6rem; color: var(--t3); margin-top: .45rem; }

        /* ─── Content columns ─── */
        .cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }

        .col-head {
            display: flex; align-items: center; gap: .5rem; margin-bottom: 1rem;
            border-bottom: 1px solid var(--bdr);
            padding-bottom: 0.5rem;
        }
        .col-ico {
            width: 29px; height: 29px; border-radius: 6px;
            display: flex; align-items: center; justify-content: center; font-size: 14px;
            background: var(--bg2); border: 1px solid var(--bdr);
        }
        .col-title { font-family: 'Aldrich', sans-serif; font-size: 1rem; font-weight: bold; color: var(--t1); text-transform: uppercase; }
        .col-badge {
            margin-left: auto;
            font-family: 'Aldrich', sans-serif; font-weight: bold;
            font-size: .7rem; color: var(--dark);
            background: var(--primary); border: 1px solid var(--dark);
            border-radius: 6px; padding: .1rem .5rem;
        }

        /* ─── News cards ─── */
        .nlist { display: flex; flex-direction: column; gap: 1rem; }

        .ncard {
            background: var(--card); border: 1px solid var(--bdr); border-radius: 8px;
            padding: 1rem; display: flex; gap: 1rem; align-items: flex-start;
            text-decoration: none; color: inherit;
            transition: transform .15s, box-shadow .2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            border-left: 4px solid var(--dark);
        }
        .ncard:hover { box-shadow: 4px 4px 0px rgba(11,5,26,0.1); transform: translate(-2px, -2px); }

        .nimg {
            width: 58px; height: 58px; border-radius: 8px;
            object-fit: cover; flex-shrink: 0; background: var(--bg2);
        }
        .nbody { flex: 1; min-width: 0; }
        .ntitle {
            font-size: .81rem; font-weight: 500; line-height: 1.4; margin-bottom: .3rem;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .nmeta { display: flex; align-items: center; gap: .4rem; }
        .nsource { font-family: 'Aldrich', sans-serif; font-size: .7rem; color: var(--primary); font-weight: bold; }
        .ndot    { width: 3px; height: 3px; border-radius: 50%; background: var(--t3); }
        .ntime   { font-family: 'Inter', sans-serif; font-size: .7rem; color: var(--t3); }

        /* ─── Game cards ─── */
        .glist { display: flex; flex-direction: column; gap: 1rem; }

        .gcard {
            background: var(--card); border: 1px solid var(--bdr); border-radius: 8px;
            padding: 1rem; display: flex; gap: 1rem; align-items: center;
            transition: transform .15s, box-shadow .2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            border-left: 4px solid var(--mint);
        }
        .gcard:hover { box-shadow: 4px 4px 0px rgba(11,5,26,0.1); transform: translate(-2px, -2px); }

        .gimg {
            width: 46px; height: 46px; border-radius: 8px;
            object-fit: cover; flex-shrink: 0; background: var(--bg2);
        }
        .gbody { flex: 1; min-width: 0; }
        .gtitle {
            font-size: .81rem; font-weight: 500; margin-bottom: .28rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .gprices { display: flex; align-items: center; gap: .4rem; }
        .gprice-s { font-family: 'Aldrich', sans-serif; font-size: 1rem; font-weight: bold; color: var(--mint); }
        .gprice-o { font-family: 'Aldrich', sans-serif; font-size: .8rem; color: var(--t3); text-decoration: line-through; }
        .gsave {
            font-family: 'Aldrich', sans-serif; font-size: .7rem; font-weight: bold; color: var(--dark);
            background: var(--primary); border: 1px solid var(--dark);
            border-radius: 4px; padding: .1rem .4rem;
        }
        .grating { font-family: 'Inter', sans-serif; font-size: .7rem; color: var(--t3); margin-top: .18rem; }

        /* ─── Skeleton ─── */
        .sk {
            background: linear-gradient(90deg, var(--card) 25%, var(--card-h) 50%, var(--card) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite; border-radius: 8px; border: 1px solid var(--bdr);
        }
        .sk-x { height: 90px; }
        .sk-c { height: 78px; }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

        /* ─── Empty / Error ─── */
        .empty {
            text-align: center; padding: 2.5rem 1rem;
            color: var(--t3); font-size: .82rem; line-height: 1.7;
        }
        .empty-ico { font-size: 2rem; margin-bottom: .5rem; display: block; }
        .empty code {
            display: block; margin-top: .5rem; font-size: .68rem;
            background: var(--bg2); border: 1px solid var(--bdr);
            border-radius: 6px; padding: .3rem .6rem; color: var(--t2);
        }
    </style>
</head>
<body>

<!-- ═══════════════════════════ NAVBAR ══════════════════════════════ -->
<nav class="nav">

    <a class="logo-wrap" href="/" title="city pulse dashboard">
        <div class="logo-svg-wrap">
            <div class="logo-bg"></div>
            <div class="logo-svg">
                <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- City skyline (soft) -->
                    <path class="city-path"
                        d="M2 22 L2 14 L5 14 L5 10 L8 10 L8 14 L10 14 L10 8 L13 8 L13 14 L15 14 L15 11 L18 11 L18 14 L21 14 L21 16 L24 16 L24 22 Z"
                        fill="rgba(255,255,255,0.22)"/>
                    <!-- Pulse / heartbeat line -->
                    <polyline class="pulse-path"
                        points="2,17 5,17 7,12 10,22 13,15 16,15 18,19 21,13 24,17"
                        stroke="rgba(255,255,255,0.9)" stroke-width="1.6"
                        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>
        <span class="nav-title">city pulse</span>
    </a>

    <div class="live"><div class="live-dot"></div>LIVE</div>

    <div class="nav-gap"></div>

    <div class="ctrl-group">
        <select class="ctrl" id="citySelect" onchange="loadData()">
            <option value="istanbul">🇹🇷 İstanbul</option>
            <option value="ankara">🇹🇷 Ankara</option>
            <option value="new york">🇺🇸 New York</option>
            <option value="london">🇬🇧 London</option>
            <option value="berlin">🇩🇪 Berlin</option>
            <option value="paris">🇫🇷 Paris</option>
            <option value="tokyo">🇯🇵 Tokyo</option>
        </select>

        <select class="ctrl" id="langSelect" onchange="loadData()">
            <option value="tr">TR</option>
            <option value="en">EN</option>
            <option value="de">DE</option>
        </select>

        <button class="btn-refresh" id="refreshBtn" onclick="loadData()">
            <span class="spin-ico" id="spinIco">⟳</span>&nbsp;Yenile
        </button>
    </div>
</nav>

<!-- ═══════════════════════════ MAIN ════════════════════════════════ -->
<main class="main">

    <div class="page-head">
        <div class="page-city">
            <span>📍</span>
            <span id="cityLabel">İstanbul</span>
        </div>
        <div class="page-time" id="pageTime"></div>
    </div>

    <!-- Exchange -->
    <div class="sec-lbl">Canlı Döviz Kurları</div>
    <div class="xgrid" id="xgrid">
        <div class="sk sk-x"></div>
        <div class="sk sk-x"></div>
        <div class="sk sk-x"></div>
        <div class="sk sk-x"></div>
    </div>

    <!-- News + Games -->
    <div class="cols">

        <div>
            <div class="col-head">
                <div class="col-ico news">📰</div>
                <div class="col-title">Günün Haberleri</div>
                <span class="col-badge" id="newsBadge">—</span>
            </div>
            <div class="nlist" id="nlist">
                <div class="sk sk-c"></div>
                <div class="sk sk-c"></div>
                <div class="sk sk-c"></div>
                <div class="sk sk-c"></div>
                <div class="sk sk-c"></div>
            </div>
        </div>

        <div>
            <div class="col-head">
                <div class="col-ico games">🎮</div>
                <div class="col-title">Oyun Fırsatları</div>
                <span class="col-badge" id="gamesBadge">—</span>
            </div>
            <div class="glist" id="glist">
                <div class="sk sk-c"></div>
                <div class="sk sk-c"></div>
                <div class="sk sk-c"></div>
                <div class="sk sk-c"></div>
                <div class="sk sk-c"></div>
            </div>
        </div>

    <!-- NASA + GitHub -->
    <div class="cols" style="margin-top: 1.5rem;">
        <div>
            <div class="col-head">
                <div class="col-ico">🚀</div>
                <div class="col-title">NASA Günün Karesi</div>
            </div>
            <div id="nasaBox" style="background: var(--card); border: 1px solid var(--bdr); border-radius: 8px; padding: 1rem; border-left: 4px solid var(--gradient);">
                <div class="sk sk-c"></div>
            </div>
        </div>

        <div>
            <div class="col-head">
                <div class="col-ico">⭐</div>
                <div class="col-title">GitHub Trending</div>
            </div>
            <div class="nlist" id="ghlist">
                <div class="sk sk-c"></div>
                <div class="sk sk-c"></div>
                <div class="sk sk-c"></div>
            </div>
        </div>
    </div>
</main>

<!-- ═══════════════════════════ JS ══════════════════════════════════ -->
<script>
    const BASE = 'http://localhost:3649/api/1.0';
    const KEY  = 'local-dev-key';

    async function api(path) {
        const r = await fetch(BASE + path, { headers: { 'X-API-Key': KEY } });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
    }

    function relTime(iso) {
        if (!iso) return '';
        const m = Math.floor((Date.now() - new Date(iso)) / 60000);
        if (m < 2)    return 'az önce';
        if (m < 60)   return `${m}dk önce`;
        if (m < 1440) return `${Math.floor(m/60)}sa önce`;
        return new Date(iso).toLocaleDateString('tr-TR');
    }

    function pct(s) {
        const n = parseFloat(s);
        return isNaN(n) ? '' : `-%${Math.round(n)}`;
    }

    /* ─── Render: Exchange ─── */
    function renderExchange(ex) {
        if (!ex) {
            document.getElementById('xgrid').innerHTML =
                '<div class="empty" style="grid-column:1/-1"><span class="empty-ico">💱</span>Döviz verisi alınamadı</div>';
            return;
        }
        const r = ex.rates || {};
        // base = USD → r.TRY, r.EUR, r.GBP, r.CHF, r.JPY
        const cards = [
            { flag:'🇺🇸', pair:'USD / TRY', desc:'1 Dolar kaç TL',   v: r.TRY },
            { flag:'🇪🇺', pair:'EUR / TRY', desc:'1 Euro kaç TL',    v: r.TRY && r.EUR ? r.TRY / r.EUR : null },
            { flag:'🇨🇭', pair:'CHF / TRY', desc:'1 Frank kaç TL',   v: r.TRY && r.CHF ? r.TRY / r.CHF : null },
            { flag:'⚖️',  pair:'EUR / USD', desc:'1 Euro kaç Dolar', v: r.EUR ? 1 / r.EUR : null },
        ];
        document.getElementById('xgrid').innerHTML = cards.map(c => `
            <div class="xcard">
                <div class="xcard-pair">${c.flag} ${c.pair}</div>
                <div class="xcard-rate">${c.v ? c.v.toFixed(4) : '—'}</div>
                <div class="xcard-desc">${c.desc}</div>
                <div class="xcard-date">📅 ${ex.date || ''}</div>
            </div>`).join('');
    }

    /* ─── Render: News ─── */
    function renderNews(articles) {
        const el = document.getElementById('nlist');
        if (!articles || !articles.length) {
            el.innerHTML = '<div class="empty"><span class="empty-ico">📭</span>Haber bulunamadı</div>';
            return;
        }
        document.getElementById('newsBadge').textContent = articles.length + ' haber';
        el.innerHTML = articles.map(a => `
            <a class="ncard" href="${a.url||'#'}" target="_blank" rel="noopener">
                ${a.image ? `<img class="nimg" src="${a.image}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}
                <div class="nbody">
                    <div class="ntitle">${a.title||''}</div>
                    <div class="nmeta">
                        <span class="nsource">${a.source?.name||'Kaynak'}</span>
                        <div class="ndot"></div>
                        <span class="ntime">${relTime(a.publishedAt)}</span>
                    </div>
                </div>
            </a>`).join('');
    }

    /* ─── Render: Games ─── */
    function renderGames(deals) {
        const el = document.getElementById('glist');
        if (!deals || !deals.length) {
            el.innerHTML = '<div class="empty"><span class="empty-ico">🎮</span>Şu an fırsat bulunamadı</div>';
            return;
        }
        document.getElementById('gamesBadge').textContent = deals.length + ' fırsat';
        el.innerHTML = deals.map(d => `
            <div class="gcard">
                ${d.thumb ? `<img class="gimg" src="${d.thumb}" alt="" loading="lazy" onerror="this.style.display='none'">` : '<div class="gimg"></div>'}
                <div class="gbody">
                    <div class="gtitle">${d.title||'—'}</div>
                    <div class="gprices">
                        <span class="gprice-s">$${parseFloat(d.salePrice||0).toFixed(2)}</span>
                        ${d.normalPrice ? `<span class="gprice-o">$${parseFloat(d.normalPrice).toFixed(2)}</span>` : ''}
                        ${d.savingsPercent ? `<span class="gsave">${pct(d.savingsPercent)}</span>` : ''}
                    </div>
                    ${d.steamRating ? `<div class="grating">⭐ ${d.steamRating}</div>` : ''}
                </div>
            </div>`).join('');
    }

    /* ─── Render: NASA ─── */
    function renderNasa(apod) {
        const el = document.getElementById('nasaBox');
        if (!apod) {
            el.innerHTML = '<div class="empty"><span class="empty-ico">🌌</span>NASA verisi alınamadı</div>';
            return;
        }
        const media = apod.mediaType === 'video'
            ? `<iframe src="${apod.url}" style="width:100%; height:200px; border:none; border-radius:8px; margin-bottom:1rem;"></iframe>`
            : `<img src="${apod.url}" alt="${apod.title}" style="width:100%; height:auto; max-height:250px; object-fit:cover; border-radius:8px; margin-bottom:1rem;">`;
            
        el.innerHTML = `
            ${media}
            <h3 style="font-size: .9rem; font-weight: 600; margin-bottom: .4rem;">${apod.title}</h3>
            <p style="font-size: .75rem; color: var(--t2); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;">${apod.explanation}</p>
            <div style="font-size: .65rem; color: var(--t3); margin-top: .6rem;">🗓️ ${apod.date}</div>
        `;
    }

    /* ─── Render: GitHub ─── */
    function renderGithub(repos) {
        const el = document.getElementById('ghlist');
        if (!repos || !repos.length) {
            el.innerHTML = '<div class="empty"><span class="empty-ico">🐙</span>Repo bulunamadı</div>';
            return;
        }
        el.innerHTML = repos.map(r => `
            <a class="ncard" href="${r.url}" target="_blank" rel="noopener">
                <img class="nimg" src="${r.avatarURL}" alt="" loading="lazy" onerror="this.style.display='none'">
                <div class="nbody">
                    <div class="ntitle">${r.fullName}</div>
                    <p style="font-size: .7rem; color: var(--t2); margin-bottom: .4rem; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;">${r.description || 'Açıklama yok'}</p>
                    <div class="nmeta">
                        <span class="nsource">⭐ ${r.stars}</span>
                        ${r.language ? `<div class="ndot"></div><span class="ntime">💻 ${r.language}</span>` : ''}
                    </div>
                </div>
            </a>`).join('');
    }

    /* ─── Loading state ─── */
    function setLoading(on) {
        const btn = document.getElementById('refreshBtn');
        btn.disabled = on;
        btn.classList.toggle('loading', on);
    }

    /* ─── Main ─── */
    async function loadData() {
        setLoading(true);
        const cityEl = document.getElementById('citySelect');
        const city   = cityEl.value;
        const lang   = document.getElementById('langSelect').value;
        document.getElementById('cityLabel').textContent =
            cityEl.options[cityEl.selectedIndex].text;

        try {
            const snap = await api(`/city/snapshot?city=${encodeURIComponent(city)}&lang=${lang}`);
            document.getElementById('pageTime').textContent =
                '🕐 ' + new Date().toLocaleTimeString('tr-TR');
            renderExchange(snap.exchange);
            renderNews(snap.news);
            renderGames(snap.gameDeals);
            renderNasa(snap.nasaApod);
            renderGithub(snap.githubTrend);
        } catch (e) {
            console.error(e);
            document.getElementById('xgrid').innerHTML = `
                <div class="empty" style="grid-column:1/-1">
                    <span class="empty-ico">⚡</span>
                    <strong>Servise ulaşılamıyor</strong>
                    <code>${e.message}</code>
                    Servis çalışıyor mu? →&nbsp;<code>go run ./main.go --dev</code>
                </div>`;
            document.getElementById('nlist').innerHTML = '';
            document.getElementById('glist').innerHTML = '';
            document.getElementById('nasaBox').innerHTML = '';
            document.getElementById('ghlist').innerHTML = '';
        } finally {
            setLoading(false);
        }
    }

    loadData();
</script>
</body>
</html>
