<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Pulse — Real-Time City Intelligence</title>
    <meta name="description" content="City Pulse ile döviz kurları, günün haberleri, oyun fırsatları ve NASA verileri tek bir platformda.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/ui/css/auth.css">
</head>
<body>

<!-- ── Looping video background ── -->
<div class="video-bg">
    <iframe
        src="https://www.youtube.com/embed/xNN7iTA57jM?autoplay=1&mute=1&loop=1&playlist=xNN7iTA57jM&controls=0&disablekb=1&modestbranding=1&rel=0&iv_load_policy=3"
        frameborder="0"
        allow="autoplay; encrypted-media"
        title="bg"
    ></iframe>
    <div class="video-overlay"></div>
</div>

<section class="hero">

    <!-- Animated geometric background -->
    <div class="hero-bg">
        <div class="geo-shapes">
            <div class="geo-shape"></div>
            <div class="geo-shape"></div>
            <div class="geo-shape"></div>
            <div class="geo-shape"></div>
            <div class="geo-shape"></div>
            <div class="geo-shape"></div>
            <div class="geo-shape"></div>
            <div class="geo-shape"></div>
        </div>
    </div>

    <!-- Main content -->
    <div class="hero-content">

        <!-- Logo -->
        <div class="hero-logo-wrap">
            <div class="hero-logo-box">
                <svg width="36" height="36" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2 22 L2 14 L5 14 L5 10 L8 10 L8 14 L10 14 L10 8 L13 8 L13 14 L15 14 L15 11 L18 11 L18 14 L21 14 L21 16 L24 16 L24 22 Z"
                        fill="rgba(255,255,255,0.25)"/>
                    <polyline
                        points="2,17 5,17 7,12 10,22 13,15 16,15 18,19 21,13 24,17"
                        stroke="rgba(255,255,255,0.95)" stroke-width="1.8"
                        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="hero-logo-text">CITY <span>PULSE</span></span>
        </div>

        <p class="hero-tagline">Real-time city intelligence platform</p>

        <h1 class="hero-title">
            Şehrin nabzını<br>
            <em>anlık</em> takip et
        </h1>

        <p class="hero-sub">
            Döviz kurları, dünya haberleri, oyun fırsatları, NASA'nın günün karesi ve GitHub trend projeleri — hepsi tek bir akıllı platformda.
        </p>

        <div class="hero-actions">
            <a href="/ui/auth.html" class="hero-btn hero-btn-primary" id="heroLoginBtn">
                🚀 Hemen Başla
            </a>
            <a href="/ui/auth.html?tab=register" class="hero-btn hero-btn-secondary" id="heroRegisterBtn">
                ✦ Kayıt Ol
            </a>
        </div>

    </div>

    <!-- Bottom stats -->
    <div class="hero-stats">
        <div class="hero-stat">
            <span class="hero-stat-val">5+</span>
            <span class="hero-stat-lbl">Canlı API</span>
        </div>
        <div class="hero-stat">
            <span class="hero-stat-val">7</span>
            <span class="hero-stat-lbl">Şehir</span>
        </div>
        <div class="hero-stat">
            <span class="hero-stat-val">∞</span>
            <span class="hero-stat-lbl">Anlık Veri</span>
        </div>
    </div>

    <div class="hero-scroll">↓ Dashboard'a gir</div>

</section>

<script>
    // Already logged in → go to dashboard
    (function() {
        const token = localStorage.getItem('cp_token');
        if (!token) return;
        try {
            const p = JSON.parse(atob(token.split('.')[1]));
            if (p.exp * 1000 > Date.now()) {
                document.getElementById('heroLoginBtn').href = '/ui/dashboard.html';
                document.getElementById('heroLoginBtn').textContent = '🚀 Dashboard\'a Git';
            }
        } catch(e) {}
    })();
</script>

</body>
</html>
