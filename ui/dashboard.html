<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — City Pulse</title>
    <link rel="icon" type="image/png" href="/ui/images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/ui/css/style.css">
</head>
<body>

<!-- ── Auth guard (immediate redirect if no token) ── -->
<script>
(function() {
    const token = localStorage.getItem('cp_token');
    if (!token) { window.location.href = '/ui/auth.html'; return; }
    try {
        const p = JSON.parse(atob(token.split('.')[1]));
        if (p.exp * 1000 < Date.now()) {
            localStorage.removeItem('cp_token');
            localStorage.removeItem('cp_user');
            window.location.href = '/ui/auth.html';
        }
    } catch(e) { window.location.href = '/ui/auth.html'; }
})();
</script>

<!-- ── Canvas Starfield Background (subtle for dashboard) ── -->
<canvas id="starfield" style="position:fixed;inset:0;width:100%;height:100%;z-index:-1;opacity:0.55;"></canvas>

<!-- ══════════════════════════ NAVBAR ══════════════════════════ -->
<nav class="nav">

    <a class="logo-wrap" href="/ui/" title="City Pulse">
        <div class="logo-svg-wrap">
            <div class="logo-bg"></div>
            <img src="/ui/images/logo.png" alt="City Pulse" style="width:36px;height:36px;object-fit:contain;border-radius:10px;">
        </div>
        <span class="nav-title">city pulse</span>
    </a>

    <div class="live"><div class="live-dot"></div>LIVE</div>

    <div class="nav-divider"></div>

    <!-- Section tabs -->
    <div class="nav-tabs">
        <button class="nav-tab active" data-section="exchange" onclick="navigateTo('exchange')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            Döviz
        </button>
        <button class="nav-tab" data-section="news" onclick="navigateTo('news')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v2"/><path d="M2 6h10v4H2z"/><line x1="6" y1="14" x2="18" y2="14"/><line x1="6" y1="18" x2="18" y2="18"/></svg>
            Haberler
        </button>
        <button class="nav-tab" data-section="games" onclick="navigateTo('games')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12m-2 0a2 2 0 1 0 4 0 2 2 0 1 0-4 0"/><path d="M6 12h.01M18 12h.01"/></svg>
            Oyunlar
        </button>
        <button class="nav-tab" data-section="nasa" onclick="navigateTo('nasa')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
            NASA
        </button>
        <button class="nav-tab" data-section="github" onclick="navigateTo('github')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
            GitHub
        </button>
        <button class="nav-tab" data-section="weather" onclick="navigateTo('weather')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg>
            Hava Durumu
        </button>
        <button class="nav-tab" data-section="crypto" onclick="navigateTo('crypto')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>
            Kripto
        </button>
    </div>

    <div class="nav-gap"></div>

    <!-- Context-sensitive controls -->
    <div class="ctrl-group" id="ctrlGroup">
        <select class="ctrl" id="citySelect" onchange="onContextChange()">
            <option value="istanbul">🇹🇷 İstanbul</option>
            <option value="ankara">🇹🇷 Ankara</option>
            <option value="new york">🇺🇸 New York</option>
            <option value="london">🇬🇧 London</option>
            <option value="berlin">🇩🇪 Berlin</option>
            <option value="paris">🇫🇷 Paris</option>
            <option value="tokyo">🇯🇵 Tokyo</option>
        </select>
        <select class="ctrl" id="langSelect" onchange="onContextChange()">
            <option value="tr">TR</option>
            <option value="en">EN</option>
            <option value="de">DE</option>
        </select>
        <button class="btn-refresh" id="refreshBtn" onclick="refresh()">
            <span class="spin-ico">⟳</span>&nbsp;Yenile
        </button>
    </div>

    <span class="nav-user" id="navUser"></span>
    <button class="btn-logout" onclick="logout()">Çıkış</button>

</nav>

<!-- ══════════════════════════ MAIN ══════════════════════════ -->
<main class="main">

    <!-- ─── SECTION: Exchange ─── -->
    <div id="section-exchange" class="section">
        <div class="page-head">
            <div class="page-city"><span>💱</span><span id="cityLabel">İstanbul</span> — Döviz Kurları</div>
            <div class="page-time" id="pageTime"></div>
        </div>
        <div class="sec-lbl">Canlı Kurlar</div>
        <div class="xgrid" id="xgrid">
            <div class="sk sk-x"></div>
            <div class="sk sk-x"></div>
            <div class="sk sk-x"></div>
            <div class="sk sk-x"></div>
        </div>
    </div>

    <!-- ─── SECTION: News ─── -->
    <div id="section-news" class="section hidden">
        <div class="page-head">
            <div class="page-city"><span>📰</span><span id="cityLabelNews">İstanbul</span> — Günün Haberleri</div>
            <span class="col-badge" id="newsBadge">—</span>
        </div>
        <div class="news-grid" id="nlist">
            <div class="sk sk-c"></div>
            <div class="sk sk-c"></div>
            <div class="sk sk-c"></div>
            <div class="sk sk-c"></div>
            <div class="sk sk-c"></div>
            <div class="sk sk-c"></div>
        </div>
    </div>

    <!-- ─── SECTION: Games ─── -->
    <div id="section-games" class="section hidden">
        <div class="page-head">
            <div class="page-city"><span>🎮</span>Oyun Fırsatları</div>
            <span class="col-badge" id="gamesBadge">—</span>
        </div>
        <div class="games-grid" id="glist">
            <div class="sk sk-c"></div>
            <div class="sk sk-c"></div>
            <div class="sk sk-c"></div>
            <div class="sk sk-c"></div>
            <div class="sk sk-c"></div>
            <div class="sk sk-c"></div>
        </div>
    </div>

    <!-- ─── SECTION: NASA ─── -->
    <div id="section-nasa" class="section hidden">
        <div class="page-head">
            <div class="page-city"><span>🚀</span>NASA — Günün Astronomik Karesi</div>
        </div>
        <div id="nasaContent">
            <div class="nasa-page">
                <div class="nasa-media"><div class="sk" style="width:100%;height:100%;min-height:400px;"></div></div>
                <div class="nasa-info">
                    <div class="sk sk-x"></div>
                    <div class="sk sk-x"></div>
                    <div class="sk sk-c"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ─── SECTION: GitHub ─── -->
    <div id="section-github" class="section hidden">
        <div class="page-head">
            <div class="page-city"><span>⭐</span>GitHub Trending</div>
        </div>
        <div class="gh-grid" id="ghgrid">
            <div class="sk sk-c"></div>
            <div class="sk sk-c"></div>
            <div class="sk sk-c"></div>
            <div class="sk sk-c"></div>
            <div class="sk sk-c"></div>
            <div class="sk sk-c"></div>
        </div>
    </div>

    <!-- ─── SECTION: Weather ─── -->
    <div id="section-weather" class="section hidden">
        <div class="page-head">
            <div class="page-city"><span>🌤️</span><span id="cityLabelWeather">İstanbul</span> — Hava Durumu</div>
        </div>
        <div id="weatherContent" style="display:flex; justify-content:center; padding:2rem 0;">
            <div class="sk sk-x" style="width:100%; max-width:500px;"></div>
        </div>
    </div>

    <!-- ─── SECTION: Crypto ─── -->
    <div id="section-crypto" class="section hidden">
        <div class="page-head">
            <div class="page-city"><span>🪙</span>Kripto Paralar (CoinGecko)</div>
        </div>
        <div class="crypto-grid" id="cryptolist" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:1rem;">
            <div class="sk sk-c"></div>
            <div class="sk sk-c"></div>
            <div class="sk sk-c"></div>
            <div class="sk sk-c"></div>
        </div>
    </div>
</main>

<script src="/ui/js/particles.js"></script>
<script>
    initStarfield('starfield', { count: 120, speed: 0.18, opacity: 0.5 });

    function logout() {
        localStorage.removeItem('cp_token');
        localStorage.removeItem('cp_user');
        window.location.href = '/ui/';
    }

    document.addEventListener('DOMContentLoaded', () => {
        const user = JSON.parse(localStorage.getItem('cp_user') || '{}');
        const el = document.getElementById('navUser');
        if (el && user.username) el.textContent = '👤 ' + user.username;
    });
</script>
<script src="/ui/js/app.js"></script>
</body>
</html>
